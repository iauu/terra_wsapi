[package]
name = "terra_wsapi"
version = "0.1.0"
edition = "2024"

[dependencies]
paste = "1.0.15"
serde_json = "1.0.151"
thiserror = "2.0.21"
axum = { version = "0.8.9", features = ["default", "ws"] }
indexmap = "2.14.2"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
ahash = "0.8.12"
rand = "0.10.3"
cfg-if = "1.0.5"
toml = "1.1.6+spec-1.1.0"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
tokio-tungstenite = { version = "0.30.0", features = ["connect", "handshake", "rustls-tls-native-roots"] }
reqwest = { version = "0.13.5", features = ["json"] }
rmp = "0.8.15"
rmp-serde = "1.3.1"
futures-util = "=0.3.33"
headers = "0.4.1"
